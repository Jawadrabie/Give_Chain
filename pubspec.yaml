name: give_chain_app
description: "GiveChain mobile application with completed feature integration."
publish_to: 'none'
version: 3.0.0+10

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.9.2
  go_router: ^17.2.3
  flutter_screenutil: ^5.9.3
  shared_preferences: ^2.5.5
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  dartz: ^0.10.1
  fluttertoast: ^9.1.0
  cached_network_image: ^3.4.1
  equatable: ^2.0.7
  intl: ^0.20.2
  url_launcher: ^6.3.2
  flutter_secure_storage: ^9.2.4
  image_picker: ^1.2.3
  file_picker: ^11.0.2
  flutter_svg: ^2.2.3
  pdf: ^3.11.1
  printing: ^5.13.3
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.4
  flutter_local_notifications: ^19.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/app_icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/config/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Variable.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Variable.ttf
          weight: 700
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Variable.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Variable.ttf
          weight: 700
